<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Results Reviewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="key-validation.css">
</head>
<body class="bg-gray-100">
    <div class="flex flex-col h-screen max-w-6xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
        <h1 class="px-6 py-5 text-2xl font-semibold border-b border-gray-200 flex-shrink-0">Validation Results Reviewer</h1>
        
        <div class="flex gap-3 items-center px-6 py-4 border-b border-gray-200 flex-shrink-0">
            <input 
                type="text" 
                id="searchInput" 
                class="flex-1 px-4 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:bg-gray-50" 
                placeholder="Search tables..."
            >
            <div class="text-xs text-gray-500">
                Server: <span id="serverStatus" class="font-mono">connecting...</span>
            </div>
        </div>
        
        <!-- Single column table list with inline expansion -->
        <div class="flex-1 overflow-y-auto p-4">
            <div id="table-list" class="flex flex-col gap-2">
                <div class="p-4 bg-blue-50 border border-blue-200 rounded">
                    <p class="text-sm text-blue-800">
                        <strong>Starting up...</strong> Connecting to Flask server on http://localhost:8001
                    </p>
                    <p class="text-xs text-blue-700 mt-2">
                        If this doesn't load, make sure the server is running:
                    </p>
                    <p class="text-xs text-gray-700 mt-2 font-mono">python3 result-reviewer/server.py</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Module dependencies (load in order) -->
    <script src="utilities.js"></script>
    <script src="data-manager.js"></script>
    <script src="state-manager.js"></script>
    <script src="filter-engine.js"></script>
    <script src="ui-renderer.js"></script>
    <script src="ui-controller.js"></script>
    <!-- Main application orchestrator -->
    <script src="viewer.js"></script>
</body>
</html>
