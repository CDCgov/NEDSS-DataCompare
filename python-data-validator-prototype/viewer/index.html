<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEDSS Data Compare - Tables</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- App-specific styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="mb-4">
            <h1 class="h2 fw-semibold mb-1">NEDSS Data Compare</h1>
            <p class="text-muted mb-0">Explore table-level UID and KEY comparison results.</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex flex-column flex-md-row align-items-md-center mb-3 gap-2">
                    <h2 class="h5 mb-0 flex-grow-1">Tables</h2>
                    <div class="table-search-wrapper flex-grow-1 flex-md-grow-0">
                        <input id="tableSearch" type="text" class="form-control" placeholder="Search tables..." aria-label="Search tables" />
                    </div>
                </div>
                
                <div id="loading" class="text-muted fst-italic small">Loading tables...</div>
                <div id="error" class="error alert alert-danger py-2 px-3 mb-2" style="display:none;"></div>
                
                <ul id="tableList" class="table-list list-unstyled mt-2" style="display:none;">
                </ul>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
